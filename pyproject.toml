[project]
name = "teenie"
version = "0.1.0"
description = "A tiny recurrent arithmetic reasoning experiment"
readme = "README.md"
authors = [
    { name = "ash-hashtag", email = "hashtag438@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "torch>=2.14.0",
]

[project.scripts]
teenie = "teenie.train:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
