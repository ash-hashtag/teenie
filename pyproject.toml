[project]
name = "teenie"
version = "0.1.0"
description = "A tiny recurrent arithmetic reasoning experiment"
readme = "README.md"
authors = [
    { name = "ash-hashtag", email = "hashtag438@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "torch>=2.14.0",
]

[project.scripts]
teenie = "teenie.train:main"
teenie-bits = "teenie.bits.train:main"
teenie-bits-eval = "teenie.bits.eval:main"
teenie-serve = "teenie.bits.serve:main"

[project.optional-dependencies]
baselines = [
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
]
tabpfn = [
    "tabpfn>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/teenie", "examples"]
